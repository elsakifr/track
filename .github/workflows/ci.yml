name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm turbo run lint typecheck test build

  # Applies every migration to a fresh, isolated database and runs all pgTAP tests (schema,
  # RLS, privileges, privacy). Database only: the tests need no other Supabase service.
  # Uses the Supabase CLI pinned in package.json and local demo keys — no secrets.
  database:
    name: Database migrations and pgTAP tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Starts Postgres in Docker and applies all migrations and the seed from scratch.
      - run: pnpm supabase db start

      # Runs supabase/tests/*.sql with pg_prove; any failing test fails the job.
      - run: pnpm supabase test db
